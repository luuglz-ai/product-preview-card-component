<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="style.css"> 
</head>
<body>
  <main>
    <div class="product-card">
      <picture>
    <source media="(max-width: 600px)" srcset="./images/image-product-mobile.jpg">
    <img src="./images/image-product-desktop.jpg" alt="Perfume Gabrielle Essence Eau De Parfum">
</picture> 
      <div class="product-info">
  <p class="product-category">Perfume</p>

  <h1>Gabrielle Essence Eau De Parfum</h1> 
<p class="product-description">
  A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL. 
</p> 

 <div class="product-prices">
    <p class="current-price">$149.99</p>
    <p class="old-price">$169.99</p>
</div> 

  <button type="button" class="add-to-cart">
    <img src="./images/icon-cart.svg" alt="">
    Add to Cart
</button>

      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Lu Gonzalez</a>.
  </footer>
</body>
</html>
